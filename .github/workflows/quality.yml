name: "Quality"

on:
  pull_request:
  push:
    branches:
      - 8.x-2.x

# We use the default concurrency grouping of allowing a single workflow per branch/PR/tag to run at the same time.
# In case of PRs we only care about the results for the last workflow run, so we cancel workflows already in progress
# when new code is pushed, in all other cases (branches/tags) we want to have a history for commits so it's easier to
# find breakages when they occur (head_ref is non-empty only when the workflow is triggered from a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.head_ref != '' }}

# github.head_ref is only set when the workflow was triggered by a pull_request and it contains the value of the source branch of the PR.
# github.ref_name will than only be used if the workflow was not triggered by a pull_request and it also just contains the branch name.
env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

# Ensure we run all commands in `bash` by default. This ensures our scripts and steps have a predictable shell syntax
# and capabilities.
defaults:
  run:
    shell: bash

jobs:
  ######################################################################################################################
  # Section - Coding Standards                                                                                         #
  #                                                                                                                    #
  # Ensures the code follows the standards we agreed upon and helps guard against deprecations and other antipatterns. #
  ######################################################################################################################
  phpstan:
    name: PHPStan
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ./dev cli composer install

      - name: PHP Stan
        run: ./dev phpstan

  phpcs:
    name: PHPCS
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: cs2pr
        env:
          fail-fast: true

      - name: Install dependencies
        run: ./dev cli composer install

      - name: PHPCS
        run: ./dev phpcs --report=checkstyle | cs2pr

  phpunit:
    name: PHPUnit
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ./dev cli composer install

      - name: Start containers
        run: ./dev up

      - name: PHPUnit
        run: ./dev phpunit

  behat:
    name: Behat
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ./dev cli composer install

      - name: Start containers
        run: ./dev up

      - name: Behat
        run: ./dev behat
